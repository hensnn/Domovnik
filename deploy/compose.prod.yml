# Produkční nasazení (Docker Compose uvnitř LXC). Spuštění:
#   cp deploy/.env.prod.example deploy/.env && editovat
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env up -d --build
name: domovnik
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: domovnik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?nastav POSTGRES_PASSWORD}
      POSTGRES_DB: domovnik
    volumes:
      - ${DATA_DIR:-/data}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domovnik -d domovnik"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://domovnik:${POSTGRES_PASSWORD}@db:5432/domovnik
      SECRET_KEY: ${SECRET_KEY:?nastav SECRET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DOMOVNIK_ENV: production
      FILES_DIR: /data/files
    volumes:
      - ${DATA_DIR:-/data}/files:/data/files
    deploy:
      resources:
        limits:
          memory: 2g

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    # CADDYFILE: /etc/caddy/Caddyfile (vlastní HTTPS) nebo /etc/caddy/Caddyfile.http (za NPM)
    command: ["caddy", "run", "--config", "${CADDYFILE:-/etc/caddy/Caddyfile}", "--adapter", "caddyfile"]
    environment:
      DOMOVNIK_HOST: ${DOMOVNIK_HOST:-domovnik.local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${PROXY_PORT:-8080}:8080"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
