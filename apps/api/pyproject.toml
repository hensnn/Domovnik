[project]
name = "domovnik"
version = "0.0.1"
description = "Domovník – domácí inventář s AI asistentem (API)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.1.8",
  "alembic>=1.20.1",
  "argon2-cffi>=25.1.0",
  "cryptography>=50.0.2",
  "python-multipart>=0.0.33",
  "pillow>=13.0.0",
  "pillow-heif>=1.8.1",
]

[project.scripts]
domovnik = "domovnik.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domovnik"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S105", "S106", "S311", "SIM905", "E501"]  # S105/6: názvy proměnných „password/secret“ nejsou tajemství

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"migrations/*" = ["E501"]
"src/domovnik/settings_registry.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: vyžaduje běžící PostgreSQL (DATABASE_URL)"]
# Pillow varuje před obřími obrázky; služba je odmítá vlastní kontrolou (viz services/imaging.py)
filterwarnings = ["ignore::PIL.Image.DecompressionBombWarning"]
